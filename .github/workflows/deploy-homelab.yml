name: Deploy frontend to homelab

on:
    release:
        types: [published]
    workflow_dispatch: {}

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Write app version
              run: |
                  if [ "${{ github.event_name }}" = "release" ]; then
                    VERSION="${{ github.event.release.tag_name }}"
                  else
                    VERSION="dev-$(git rev-parse --short HEAD)"
                  fi
                  echo "export const APP_VERSION = '$VERSION';" > src/environments/version.ts

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/dat-honguyen/werewolf-frontend:latest
                      ghcr.io/dat-honguyen/werewolf-frontend:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: [self-hosted, homelab]
        steps:
            - name: Pull latest image and restart
              run: |
                  podman pull ghcr.io/dat-honguyen/werewolf-frontend:latest
                  systemctl --user restart werewolf-fe
                  systemctl --user is-active werewolf-fe
